services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  # Local SMTP server that catches every email; web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"

  # S3-compatible object storage for media files; web console on http://localhost:9001
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-tasks-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-tasks-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  # Antivirus scanning every upload; needs about 1 GB of RAM. Set ANTIVIRUS_ENABLED=false in .env to skip it.
  clamav:
    image: clamav/clamav:1.5.4-debian
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  rustfs_data:
  clamav_data: