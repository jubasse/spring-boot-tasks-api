services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  # Local SMTP server that catches every email; web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "8025:8025"

volumes:
  postgres_data: