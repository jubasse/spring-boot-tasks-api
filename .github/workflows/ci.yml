name: CI

on:
  push:
    branches:
      - main
      - develop
      - "features/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main

# A newer push on the same branch or pull request cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit and integration tests; Testcontainers uses the runner's Docker daemon. Reuse is on, as on developer
      # machines, so that every test context shares one database here too and an isolation defect shows in both.
      - name: Build and test
        env:
          TESTCONTAINERS_REUSE_ENABLE: "true"
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history so every commit of the push or pull request is scanned
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No licence key needed for repositories owned by a personal account
      - name: Scan with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, to read the document of the pull request's base branch
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint the OpenAPI document
        run: npx --yes @stoplight/spectral-cli@6.16.3 lint docs/openapi.json --fail-severity warn

      # The base branch may not have a document yet (the pull request that adds it)
      - name: Read the base branch's document
        if: github.event_name == 'pull_request'
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:docs/openapi.json" > base-openapi.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # fail-on defaults to never failing, and review to uploading both documents to oasdiff.com
      - name: Detect breaking changes
        if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: base-openapi.json
          revision: docs/openapi.json
          fail-on: ERR
          review: false
          github-token: ""
