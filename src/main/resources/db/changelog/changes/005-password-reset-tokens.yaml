databaseChangeLog:
- changeSet:
    id: 005-create-password-reset-tokens
    author: julien-metral
    comment: >
      Single-use password reset tokens. Only the SHA-256 hash of a token is stored.
    changes:
    - createTable:
        tableName: password_reset_tokens
        columns:
        - column:
            name: id
            type: UUID
            defaultValueComputed: uuidv7()
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: password_reset_tokensPK
        - column:
            name: user_id
            type: UUID
            constraints:
              nullable: false
        - column:
            name: token_hash
            type: VARCHAR(64)
            constraints:
              nullable: false
        - column:
            name: created_at
            type: TIMESTAMP(6) WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: expires_at
            type: TIMESTAMP(6) WITH TIME ZONE
            constraints:
              nullable: false
        - column:
            name: used_at
            type: TIMESTAMP(6) WITH TIME ZONE
    - addUniqueConstraint:
        tableName: password_reset_tokens
        columnNames: token_hash
        constraintName: password_reset_tokens_token_hashUQ
    - addForeignKeyConstraint:
        baseTableName: password_reset_tokens
        baseColumnNames: user_id
        constraintName: password_reset_tokens_userFK
        referencedTableName: users
        referencedColumnNames: id
    - createIndex:
        tableName: password_reset_tokens
        indexName: password_reset_tokens_user_idIDX
        columns:
        - column:
            name: user_id
