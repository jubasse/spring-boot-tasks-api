security:
  jwt:
    issuer: tasks-api
    ttl: 15m
    secret: ${JWT_SECRET}
  refresh-token:
    ttl: 30d
identity:
  email-verification:
    ttl: 24h
    # Front-end page that reads ?token=... and calls POST /api/v1/auth/verify-email
    verify-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
mail:
  from: ${MAIL_FROM:no-reply@tasks.local}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tasks

  # Virtual threads for request handling and @Async work (e.g. sending emails)
  threads:
    virtual:
      enabled: true

  # Defaults target the Mailpit service of compose.yaml (web UI: http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml