security:
  jwt:
    issuer: tasks-api
    ttl: 15m
    secret: ${JWT_SECRET}
  refresh-token:
    ttl: 30d
identity:
  email-verification:
    ttl: 24h
    # Front-end page that reads ?token=... and calls POST /api/v1/auth/verify-email
    verify-url: ${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
  password-reset:
    ttl: 1h
    # Front-end page that reads ?token=..., asks for a new password and calls POST /api/v1/auth/password-reset/confirm
    reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  # GDPR retention: erases the personal data of deleted users, and deletes accounts left inactive after a warning
  retention:
    enabled: ${USER_RETENTION_ENABLED:true}
    cron: ${USER_RETENTION_CRON:0 0 4 * * *}
    anonymize-after: 30d
    inactivity-period: 730d
    deletion-notice: 30d
  # The account status checked on every task request (see UserStatusLookup)
  status-cache:
    ttl: ${IDENTITY_STATUS_CACHE_TTL:30s}
    maximum-size: 10000
mail:
  from: ${MAIL_FROM:no-reply@tasks.local}
# Requests counted per client address or account on the endpoints anyone can call; over a limit, 429 with Retry-After
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  purge-cron: 0 20 * * * *
  login-per-ip: {requests: 30, window: PT1M}
  login-per-email: {requests: 10, window: PT15M}
  sign-up-per-ip: {requests: 20, window: PT1H}
  password-reset-per-ip: {requests: 20, window: PT1H}
  password-reset-per-email: {requests: 3, window: PT1H}
  verification-resend-per-user: {requests: 3, window: PT1H}
  webhook-test-per-user: {requests: 10, window: PT1H}
# Messages for RabbitMQ are written to an outbox table in the business transaction, then published after commit
messaging:
  outbox:
    poll-interval: PT5S
    batch-size: 100
    max-retry-delay: PT10M
    confirm-timeout: PT5S
    retention: P7D
    purge-cron: 0 0 * * * *
# Media file storage. storage.driver picks the implementation: rustfs (defaults match compose.yaml) or aws-s3.
storage:
  driver: ${STORAGE_DRIVER:rustfs}
  bucket: ${S3_BUCKET:tasks-media}
  presigned-url-ttl: 10m
  rustfs:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:tasks-dev}
    secret-key: ${S3_SECRET_KEY:tasks-dev-secret}
    create-bucket: ${S3_CREATE_BUCKET:true}
  aws-s3:
    # Credentials come from the AWS default chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, IAM role, ...)
    region: ${AWS_REGION:eu-west-3}
antivirus:
  enabled: ${ANTIVIRUS_ENABLED:true}
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}
  timeout: 60s
media:
  avatar-max-size: 5MB
  attachment-max-size: 25MB
  # Purges files of soft-deleted tasks and users after the retention period, and orphan rows or objects
  cleanup:
    enabled: ${MEDIA_CLEANUP_ENABLED:true}
    cron: ${MEDIA_CLEANUP_CRON:0 30 3 * * *}
    retention: ${MEDIA_CLEANUP_RETENTION:30d}
    orphan-grace-period: 1d
# Emails assignees when an open task is due soon and when it becomes overdue, once per due date
task:
  reminders:
    enabled: ${TASK_REMINDERS_ENABLED:true}
    cron: ${TASK_REMINDERS_CRON:0 */15 * * * *}
    due-soon-lead-time: 24h
    overdue-lookback: 7d
# Health, metrics and build info on a port of their own. Warning: expose it only to the monitoring network, never to
# the internet; it needs no authentication.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, sbom
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # Ready when every request can be served, which only needs the database. RabbitMQ down only delays emails and
      # photos (the outbox keeps them), and storage or antivirus down only blocks files: the overall health reports
      # them, but taking the API out of the load balancer for them would stop everything else too.
      group:
        readiness:
          include: &readiness-components readinessState, db
        # The probes again on the API port, where they show no details: a probe on the separate management port could
        # pass while the API port no longer answers. Groups of their own rather than add-additional-paths, because a
        # group's settings apply to all its paths: hiding the details of readiness on /readyz hid them on 8081 too.
        livez:
          include: livenessState
          show-details: never
          additional-path: server:/livez
        readyz:
          include: *readiness-components
          show-details: never
          additional-path: server:/readyz
# Behind a reverse proxy, set FORWARD_HEADERS_STRATEGY=native (or framework) so that the client address used by the
# rate limits comes from X-Forwarded-For; without a proxy, keep none, or clients could pick their own address
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
# Endpoints users declare to receive their task notifications. The key encrypts their signing secrets in the
# database: Base64 of at least 32 bytes (openssl rand -base64 32). Only a development machine turns requireHttps off,
# with OUTBOUND_HTTP_ALLOWED_ADDRESSES, to reach a local receiver.
webhooks:
  encryption-key: ${WEBHOOK_ENCRYPTION_KEY:}
  require-https: ${WEBHOOK_REQUIRE_HTTPS:true}
  max-per-user: 5
  previous-secret-validity: 24h
  concurrent-deliveries: 4
  delivery-lease: 5m
  retry-enabled: ${WEBHOOK_RETRY_ENABLED:true}
  retry-poll-interval: PT30S
  retry-batch-size: 100
  disable-after: 3d
  delivery-retention: 30d
  purge-enabled: ${WEBHOOK_PURGE_ENABLED:true}
  purge-cron: 0 45 3 * * *
# Outgoing HTTP calls (webhooks) reach only public addresses; OutboundHttpConfiguration explains why. To try a
# receiver on your machine, set OUTBOUND_HTTP_ALLOWED_ADDRESSES=127.0.0.1/32.
outbound-http:
  allowed-addresses: ${OUTBOUND_HTTP_ALLOWED_ADDRESSES:}
spring:
  config:
    import: optional:file:.env[.properties]
  # An enum in a request is one of its documented names: Jackson otherwise reads a number as the constant at that
  # index, so "kind": 1 created a Slack webhook
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  # Apache HttpClient explicitly: it would otherwise be picked only because the AWS SDK brings it, and its address
  # filtering also holds against DNS rebinding
  http:
    clients:
      imperative:
        factory: http-components
      # Apache's own defaults wait minutes for a connection. A client group can set its own values.
      connect-timeout: 5s
      read-timeout: 15s
    # The client that delivers webhooks (WebhookClient). A redirect or a cookie would let a receiver steer the next
    # call, so neither is followed.
    serviceclient:
      webhooks:
        connect-timeout: 5s
        read-timeout: 15s
        redirects: dont-follow
        cookie-handling: disable
  data:
    web:
      pageable:
        # A larger size is clamped silently; the page metadata carries the size actually used
        max-page-size: 100
  cache:
    type: caffeine
    # Each cache is configured in CacheConfiguration; listing them makes a mistyped name fail
    cache-names: userStatus, mediaDownloads
  application:
    name: tasks

  # Connection: spring-boot-docker-compose provides it in development (rabbitmq service); set SPRING_RABBITMQ_HOST,
  # SPRING_RABBITMQ_USERNAME and SPRING_RABBITMQ_PASSWORD elsewhere
  rabbitmq:
    # The outbox relay waits for the broker to confirm each message, and to not return it as unroutable, before
    # marking it published
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 2
        # Failed messages are retried in the consumer, then dead-lettered (see MailQueues): about 1.5 minutes in all
        retry:
          enabled: true
          max-retries: 4
          initial-interval: 2s
          multiplier: 3
          max-interval: 1m

  # Must allow the largest media upload (media.attachment-max-size)
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  # Virtual threads for request handling and @Async work (e.g. sending emails)
  threads:
    virtual:
      enabled: true

  # Defaults target the Mailpit service of compose.yaml (web UI: http://localhost:8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  jpa:
    hibernate:
      ddl-auto: validate
    # Off: the persistence context closes with the service's transaction, so a response that reads an association
    # nobody loaded fails in tests instead of silently firing one query per row while rendering JSON
    open-in-view: false
    properties:
      # Any lazy association or collection left unloaded is fetched for up to 50 rows at once (IN) instead of per row
      hibernate.default_batch_fetch_size: 50

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
# API documentation (see OpenApiConfiguration): the spec at /v3/api-docs and Swagger UI at /swagger-ui.html
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: openapi_3_1
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # Before 3.1.1, one spec was generated and kept per Accept-Language: varying it exhausted the memory
  allowed-locales: en
  # Handlers of ApiExceptionHandler would otherwise be added as responses of every operation
  override-with-generic-response: false
  # A stable output for the committed docs/openapi.json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
