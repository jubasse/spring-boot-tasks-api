# Test-only overrides. Spring Boot loads classpath:/config/application.yaml on top of the main
# application.yaml, so tests run without a .env file (e.g. in CI).
security:
  jwt:
    # Random key used only by tests, never by a running application
    secret: ZTtrL2V2nGPBOyiISTm31nCcKgVbBYhGHG0VZF61VjA= # gitleaks:allow
exports:
  purge-enabled: false
  recovery-enabled: false
webhooks:
  # Random key used only by tests
  encryption-key: 3ZL0YDn5mPj4vJq3Z3qg6d7xk1W0bR8yLt2cVnHsQeU= # gitleaks:allow
  # Tests reach MockWebServer over plain HTTP on 127.0.0.1
  require-https: false
  # Tests call WebhookDeliveryService.enqueueDue and purge directly
  retry-enabled: false
  purge-enabled: false
outbound-http:
  allowed-addresses: 127.0.0.1/32
task:
  reminders:
    # Tests call TaskReminderService directly: a scheduled run could email tasks of other tests mid-assertion
    enabled: false
identity:
  retention:
    # Tests call UserRetentionService directly with a fixed clock
    enabled: false
rate-limit:
  # Most tests log in and sign up many times from the same address; RateLimitTests turns the limits on
  enabled: false
media:
  cleanup:
    # Tests call MediaCleanupService directly
    enabled: false
messaging:
  outbox:
    # Reused containers share one database between test contexts: a poller running every few seconds would publish
    # the rows of another context to its own broker. Messages still go out right after their commit; tests that
    # exercise the retries call OutboxRelay.publishDue themselves.
    poll-interval: PT1H
spring:
  testcontainers:
    beans:
      startup: parallel
  http:
    serviceclient:
      webhooks:
        # WebhookDeliveryTests answers slower than this to get a Timeout; the shipped 15 s would stall that test.
        # Here rather than on the class, which would start another context.
        read-timeout: 2s
  jpa:
    properties:
      # Counts the statements of a request in the query-count tests; records nothing unless a test asks for it
      hibernate.session_factory.statement_inspector: io.julienmetral.tasks.support.SqlStatementCounter
