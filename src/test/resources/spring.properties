# Each cached test context keeps its own RabbitMQ running, and all its containers when Testcontainers reuse is off.
# Spring's default of 32 cached contexts once kept a dozen full contexts alive at once and exhausted the memory. The
# integration contexts (about 5) are the heavy ones now; the slices hold at most a Postgres. 12 leaves room for all
# of them: an evicted context is closed and restarts its containers when a later class needs it again.
spring.test.context.cache.maxSize=12
# Spring 7 pauses a cached context on every context switch, and each RabbitMQ listener container then waits for
# its consumers' 1 s receiveTimeout (22.5 s per CI run, measured on 2026-10-12). Every test context has its own
# broker, so a running cached context consumes nothing that belongs to another one.
spring.test.context.cache.pause=never
